name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag label (e.g. v0.1.0-rc1)'
        required: false
        default: 'v0.1.0-rc1'
        type: string
      dry_run:
        description: 'Build split release APKs without publishing a GitHub Release or requiring signing secrets'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release-android:
    name: Build Signed Split APKs & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            DRY_RUN="false"
          else
            TAG="${{ inputs.version_tag }}"
            DRY_RUN="${{ inputs.dry_run }}"
          fi
          BUILD_NAME="${TAG#v}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "is_dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare and verify Android release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/klipfetch-release.jks"
            if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"; then
              echo "::error::Failed to decode KEYSTORE_BASE64 secret."
              exit 1
            fi
            chmod 600 "$KEYSTORE_FILE"
            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::Keystore verification failed: verify KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEY_ALIAS."
              rm -f "$KEYSTORE_FILE"
              exit 1
            fi
            {
              echo "KLIPFETCH_KEYSTORE_PATH=$KEYSTORE_FILE"
              echo "KLIPFETCH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KLIPFETCH_KEY_ALIAS=$KEY_ALIAS"
              echo "KLIPFETCH_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release keystore verified and configured from repository secrets."
          elif [ "${{ steps.meta.outputs.is_dry_run }}" = "false" ]; then
            echo "::error::Missing one or more required signing secrets (KEYSTORE_BASE64, KEY_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD). See docs/RELEASE_AND_QA.md for setup instructions."
            exit 1
          else
            echo "::notice::Dry-run without signing secrets; building release APKs with debug signing fallback."
          fi

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            third_party/libreget-core
            rust

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Run GPL-3.0 & non-GMS dependency audit
        run: |
          chmod +x scripts/audit_dependencies.sh
          ./scripts/audit_dependencies.sh

      - name: Run libreget-core mobile unit tests
        run: cargo test --manifest-path third_party/libreget-core/Cargo.toml --no-default-features --features mobile

      - name: Run klipfetch_ffi Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Cross-compile Rust FFI for arm64-v8a and armeabi-v7a
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK_DIR" ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR="$(ls -d "$ANDROID_HOME/ndk"/* | sort -V | tail -n 1)"
          fi
          echo "Using ANDROID_NDK_HOME=$NDK_DIR"
          mkdir -p android/app/src/main/jniLibs
          cd rust
          ANDROID_NDK_HOME="$NDK_DIR" cargo ndk -t arm64-v8a -t armeabi-v7a --platform 24 -o ../android/app/src/main/jniLibs build --release
          test -f ../android/app/src/main/jniLibs/arm64-v8a/libklipfetch_ffi.so
          test -f ../android/app/src/main/jniLibs/armeabi-v7a/libklipfetch_ffi.so

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android split-per-ABI release APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name="${{ steps.meta.outputs.build_name }}" \
            --build-number="${{ steps.meta.outputs.build_number }}"

      - name: Package APKs and generate SHA-256 checksums
        run: |
          mkdir -p dist
          TAG="${{ steps.meta.outputs.release_tag }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/klipfetch-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/klipfetch-${TAG}-armeabi-v7a.apk"

          unzip -l "dist/klipfetch-${TAG}-arm64-v8a.apk" | grep "lib/arm64-v8a/libklipfetch_ffi.so"
          unzip -l "dist/klipfetch-${TAG}-armeabi-v7a.apk" | grep "lib/armeabi-v7a/libklipfetch_ffi.so"

          (
            cd dist
            sha256sum "klipfetch-${TAG}-arm64-v8a.apk" "klipfetch-${TAG}-armeabi-v7a.apk" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/klipfetch-release.jks"

      - name: Upload release APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: klipfetch-release-${{ steps.meta.outputs.release_tag }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG.md
        if: steps.meta.outputs.is_dry_run == 'false'
        env:
          BUILD_NAME: ${{ steps.meta.outputs.build_name }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os, re

          build_name = os.environ["BUILD_NAME"]
          tag = os.environ["RELEASE_TAG"]
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              text = f.read()

          header_re = re.compile(rf"^## \[{re.escape(build_name)}\][^\n]*\n", re.MULTILINE)
          m = header_re.search(text)
          body = ""
          if m:
              rest = text[m.end():]
              end_m = re.search(r"^(?:## \[|\[[^\]]+\]:\s*https?://)", rest, re.MULTILINE)
              body = (rest[:end_m.start()] if end_m else rest).strip()

          parts = [f"## What's Changed in {tag}"]
          if body:
              parts.append(body)
          else:
              parts.append(f"Release {tag} for Android (`arm64-v8a` & `armeabi-v7a`).")

          parts.append(
              "### Android APK Downloads\n"
              f"- `klipfetch-{tag}-arm64-v8a.apk` — Modern 64-bit Android devices *(recommended for most phones)*\n"
              f"- `klipfetch-{tag}-armeabi-v7a.apk` — Legacy 32-bit ARM Android devices\n"
              "- `SHA256SUMS.txt` — SHA-256 verification checksums"
          )

          out_path = os.path.join(os.environ["RUNNER_TEMP"], "release-notes.md")
          with open(out_path, "w", encoding="utf-8") as f:
              f.write("\n\n".join(parts) + "\n")
          PY

      - name: Publish GitHub Release
        if: steps.meta.outputs.is_dry_run == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: KlipFetch ${{ steps.meta.outputs.release_tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/klipfetch-*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
