name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  flutter-android:
    name: Rust Core, NDK FFI, Flutter Tests & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            third_party/libreget-core
            rust

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Run GPL-3.0 & non-GMS dependency audit
        run: |
          chmod +x scripts/audit_dependencies.sh
          ./scripts/audit_dependencies.sh

      - name: Run libreget-core mobile unit tests
        run: cargo test --manifest-path third_party/libreget-core/Cargo.toml --no-default-features --features mobile

      - name: Run klipfetch_ffi Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Cross-compile Rust FFI for Android arm64-v8a
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK_DIR" ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR="$(ls -d "$ANDROID_HOME/ndk"/* | sort -V | tail -n 1)"
          fi
          echo "Using ANDROID_NDK_HOME=$NDK_DIR"
          mkdir -p android/app/src/main/jniLibs
          cd rust
          ANDROID_NDK_HOME="$NDK_DIR" cargo ndk -t arm64-v8a --platform 24 -o ../android/app/src/main/jniLibs build --release

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify Rust FFI shared library in APK
        run: unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep libklipfetch_ffi.so

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: klipfetch-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
