[package]
name = "libreget-core"
version = "0.2.16-klipfetch.1"
edition = "2021"
license = "GPL-3.0"
description = "Mobile-pruned pure-Rust core from OpenSelena/libreget for KlipFetch (Android-only: TikTok, Instagram, YouTube routing)."

[lib]
name = "libreget_core"

[features]
default = ["mobile"]
mobile = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "http2", "gzip", "brotli", "deflate", "rustls-tls", "multipart"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sanitize-filename = "0.6"
unicode-normalization = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
urlencoding = "2"
rand = "0.10.0"
base64 = "0.22.1"
sha2 = "0.10"
once_cell = "1"
thiserror = "1"
filetime = "0.2.27"
